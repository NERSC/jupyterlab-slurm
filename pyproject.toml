[build-system]
# `jupyter-builder` (PyPI)/`@jupyter/builder` (npm) is the standalone
# successor to `jupyterlab`'s bundled build tooling (see the JupyterLab 4.5
# to 4.6 migration guide). Depending on the full `jupyterlab` package here
# pulled in the legacy `@jupyterlab/builder`/`@jupyterlab/core-meta` lookup,
# which fails outright for 4.5.x since no 4.5.x `@jupyterlab/core-meta`
# releases were ever published on npm.
requires = ["hatchling>=1.5.0", "jupyter-builder>=1.0.0", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "jupyterlab_slurm"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "jupyter_server>=2.0.1,<3"
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[project.optional-dependencies]
test = [
    "coverage",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-jupyter[server]>=0.6.0",
    # Tornado 6.5.9 added a required `allowed_symlink_directory` attribute to
    # `StaticFileHandler` that jupyter_server's `FileFindHandler` subclass
    # doesn't set yet, breaking static file serving (and thus
    # `jupyter.browser_check`/Playwright browser tests) with an
    # AttributeError. Pin below the broken release until jupyter_server ships
    # a fix (see https://github.com/jupyter-server/jupyter_server/issues/1702).
    "tornado<6.5.9"
]
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-rtd-theme",
    "sphinxcontrib-mermaid"
]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls"]

[tool.hatch.build.targets.sdist]
artifacts = ["jupyterlab_slurm/labextension"]
exclude = [
    ".github",
    "binder",
    ".idea",
    "coverage",
    ".stylelintcache",
    ".eslintcache",
    "*.log",
]
# NOTE: the opt-in compatibility test-suite harness (jupyterlab_slurm/test_suite.py)
# is intentionally NOT excluded here by default, so local/dev sdist and wheel
# builds keep the feature available (guarded by SlurmTesting.enabled, which
# defaults to False). To produce a production build that omits the harness
# module entirely, run `python scripts/strip_test_suite_from_build.py` before `python -m build`.

[tool.hatch.build.targets.wheel.shared-data]
# `jupyterlab_slurm/labextension` already contains its own built `install.json`
# (generated by the jupyter-builder hook below), so a separate top-level
# `install.json` -> same target-path mapping here would collide with it
# (newer hatchling versions reject this as "a second file is being added to
# the wheel archive at the same path").
"jupyterlab_slurm/labextension" = "share/jupyter/labextensions/jupyterlab-slurm"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.version]
path = "jupyterlab_slurm/_version.py"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "jupyterlab_slurm/labextension/static/style.js",
    "jupyterlab_slurm/labextension/package.json",
]
skip-if-exists = ["jupyterlab_slurm/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "jupyterlab_slurm/labextension"

[tool.jupyter-releaser.options]
version_cmd = "hatch version"

[tool.jupyter-releaser.hooks]
before-build-npm = [
    "python -m pip install 'jupyterlab>=4.5.7,<5'",
    # `jlpm` here resolves to JupyterLab's bundled (older Yarn 3.x) package
    # manager, installed by the pip command above. Our yarn.lock is Yarn 4.x
    # format (lockfile version 10), so under the releaser's default
    # immutable-install mode the older bundled Yarn thinks the lockfile
    # needs modification and aborts (YN0028), surfacing as a bare
    # "Command 'jlpm' returned non-zero exit status 1." Disabling immutable
    # installs for these steps avoids that (same workaround as in
    # build.yml/ci.yml/update-integration-tests.yml).
    "YARN_ENABLE_IMMUTABLE_INSTALLS=false jlpm",
    "YARN_ENABLE_IMMUTABLE_INSTALLS=false jlpm build:prod"
]
before-build-python = ["jlpm clean:all"]

[tool.check-wheel-contents]
ignore = ["W002"]
