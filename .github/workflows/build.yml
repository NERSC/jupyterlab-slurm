name: Build

on:
  push:
    branches: main
  pull_request:
    branches: '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install dependencies
        run: python -m pip install -U "jupyterlab>=4.0.0,<5"

      - name: Lint the extension
        # `jlpm` here resolves to JupyterLab's bundled (older Yarn 3.x)
        # package manager, installed by the "Install dependencies" step
        # above. Our yarn.lock is Yarn 4.x format (lockfile version 10), so
        # under CI's default immutable-install mode the older bundled Yarn
        # thinks the lockfile needs modification and aborts (YN0028) with a
        # terse "Failed with errors" message. Disabling immutable installs
        # for this step avoids that (see the "Build the extension"/"Package
        # the extension" steps below for the same workaround).
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
        run: |
          set -eux
          jlpm
          jlpm run lint:check

      - name: Type-check the extension
        run: |
          set -eux
          jlpm tsc --noEmit

      - name: Test the extension
        run: |
          set -eux
          jlpm run test

      - name: Audit frontend dependencies
        # Advisory only: report known-vulnerability findings without failing the
        # build. An engineer should periodically review this output (see
        # production_checklist.md §2); upgrade to a hard failure once a
        # triage/owner process is in place.
        run: |
          set -eux
          jlpm npm audit --severity moderate --all || true

      - name: Build the extension
        # hatch-jupyter-builder's bundled `jlpm` uses an internal Yarn 3.x,
        # while yarn.lock here is generated by the newer Yarn 4.x used for
        # the "Lint the extension" step above (lockfile version 10). Under
        # CI, Yarn defaults to immutable installs, so the older bundled Yarn
        # thinks the lockfile needs modification and aborts (YN0028), which
        # surfaces as "AttributeError: module 'hatchling.build' has no
        # attribute 'prepare_metadata_for_build_editable'"/build failures.
        # Disabling immutable installs for this build step avoids that.
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
        run: |
          set -eux
          python -m pip install .[test]

          pytest -vv -r ap --cov jupyterlab_slurm
          jupyter server extension list
          jupyter server extension list 2>&1 | grep -ie "jupyterlab_slurm.*OK"

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "jupyterlab-slurm.*OK"
          python -m jupyterlab.browser_check

      - name: Audit backend dependencies
        # Advisory only, see the frontend audit step above for rationale.
        run: |
          set -eux
          python -m pip install pip-audit
          python -m pip_audit || true

      - name: Package the extension
        # See the "Build the extension" step above: `python -m build` also
        # triggers hatch-jupyter-builder's bundled (older) `jlpm`, which can
        # hit the same lockfile-immutability failure against our Yarn 4.x
        # yarn.lock.
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
        run: |
          set -eux

          pip install build
          python -m build
          pip uninstall -y "jupyterlab_slurm" jupyterlab

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: dist/jupyterlab_slurm*
          if-no-files-found: error

  test_isolated:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'
      - uses: actions/download-artifact@v4
        with:
          name: extension-artifacts
      - name: Install and Test
        run: |
          set -eux
          # Remove NodeJS, twice to take care of system and locally installed node versions.
          sudo rm -rf $(which node)
          sudo rm -rf $(which node)

          # See the tornado pin note on the "Build the extension" step: pin
          # below tornado 6.5.9, which broke jupyter_server's FileFindHandler
          # (https://github.com/jupyter-server/jupyter_server/issues/1702),
          # needed here since browser_check still touches static handlers.
          pip install "jupyterlab>=4.0.0,<5" "tornado<6.5.9" jupyterlab_slurm*.whl


          jupyter server extension list
          jupyter server extension list 2>&1 | grep -ie "jupyterlab_slurm.*OK"

          jupyter labextension list
          jupyter labextension list 2>&1 | grep -ie "jupyterlab-slurm.*OK"
          python -m jupyterlab.browser_check --no-browser-test

  integration-tests:
    name: Integration tests
    needs: build
    runs-on: ubuntu-latest

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Download extension package
        uses: actions/download-artifact@v4
        with:
          name: extension-artifacts

      - name: Install the extension
        run: |
          set -eux
          # Pin below tornado 6.5.9, which broke jupyter_server's
          # FileFindHandler (https://github.com/jupyter-server/jupyter_server/issues/1702)
          # and would otherwise break the Playwright integration tests below,
          # which fully load the JupyterLab page (served via static handlers).
          python -m pip install "jupyterlab>=4.0.0,<5" "tornado<6.5.9" jupyterlab_slurm*.whl

      - name: Install dependencies
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: jlpm install

      - name: Set up browser cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock') }}

      - name: Install browser
        run: jlpm playwright install chromium
        working-directory: ui-tests

      - name: Execute integration tests
        working-directory: ui-tests
        run: |
          jlpm playwright test

      - name: Upload Playwright Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jupyterlab_slurm-playwright-tests
          path: |
            ui-tests/test-results
            ui-tests/playwright-report

  check_links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
      - uses: jupyterlab/maintainer-tools/.github/actions/check-links@v1
