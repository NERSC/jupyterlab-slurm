name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      # The build backend (hatchling + hatch-jupyter-builder, configured via a
      # custom `[tool.hatch.metadata.hooks.nodejs]` metadata hook) has to run a
      # full `jlpm install`/build even just to prepare metadata for an editable
      # install (see https://github.com/pypa/hatch/issues/1114), so Node/Yarn
      # must be available before `pip install -e .` runs, otherwise it fails
      # with "AttributeError: module 'hatchling.build' has no attribute
      # 'prepare_metadata_for_build_editable'". `base-setup` provisions both
      # Python (matching the matrix version) and Node/jlpm.
      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1
        with:
          python_version: ${{ matrix.python-version }}
      - name: Install test deps
        # hatch-jupyter-builder's bundled `jlpm` uses an internal Yarn 3.x,
        # while yarn.lock here is generated by the newer Yarn 4.x used for
        # local/CI frontend builds (lockfile version 10). Under CI, Yarn
        # defaults to immutable installs, so the older bundled Yarn thinks
        # the lockfile needs modification and aborts (YN0028), which in turn
        # surfaces as "AttributeError: module 'hatchling.build' has no
        # attribute 'prepare_metadata_for_build_editable'" from pip. Disabling
        # immutable installs just for this metadata-build step avoids that.
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]
      - name: Run pytest
        run: |
          pytest -q --maxfail=1 --disable-warnings -r fE
